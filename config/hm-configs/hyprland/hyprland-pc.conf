###############
## AUTOSTART ##
###############

## Streamdeck
# exec-once = flatpak run com.core447.StreamController -b
exec-once = streamcontroller -b

##########
## Main ##
##########

# monitor = DP-1, highres@highrr, 0x0, 1
# monitor = DP-2, highres@highrr, -2560x0, 1

source = ~/.config/hypr/dms/outputs.conf

## Vnc testing
# monitor = VNC-1, 1920x1080@60, 0x0, 1, mirror, DP-1

input {
  kb_layout = us
  # kb_options = grp:alt_shift_toggle
  follow_mouse = 1
  numlock_by_default=true
  touchpad {
    natural_scroll = true
    disable_while_typing = true
    scroll_factor = 0.8
  }
  sensitivity = 0 ## -1.0 - 1.0, 0 means no modification.
  accel_profile = flat
}
