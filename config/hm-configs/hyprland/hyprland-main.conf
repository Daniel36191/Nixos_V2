##############
## Programs ##
##############

$terminal = kitty
# $editor = code --enable-features=UseOzonePlatform --ozone-platform=wayland
$editor = code
$noteeditor = obsidian
$fileManager = nautilus
$browser = librewolf
# $youtube = nix-shell -p google-chrome --run "google-chrome-stable --app=https://youtube.com/"
$youtube = $browser --new-window www.youtube.com
# $menu = rofi -run-list-command ". ~/.bash_aliases" -run-command "bash -i -c '{cmd}'" -show drun
$menu = dms ipc call spotlight toggle
$screenshot = grimblast --freeze copy area
$clipboardhistory = cliphist list | rofi -dmenu | cliphist decode | wl-copy
$hardwaremanager = kitty -e btop
$gpumanager = kitty -e nvtop
$wallsetter = none


###############
## AUTOSTART ##
###############

## VNC Server
# exec-once = wayvnc -g 192.168.8.194

## Clipbard manager
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = cliphist wipe #clears old clipbard

## Qpwgraph -background
exec-once =  [workspace special:sound silent] qpwgraph -m -a ~/Desktop/Design/qpwgraph/Main.qpwgraph
windowrule {
  name = Qpwgraph
  match:class = org.rncbc.qpwgraph
  workspace = special:sound silent
}

## Bespoke Synth with peoper input and output support
exec-once = [workspace special:sound silent] BespokeSynth ~/Desktop/Design/Bespoke-Synth/Saves/main.bsk &
windowrule {
  name = Bespoke
  match:class = BespokeSynth
  match:title = bespoke synth
  workspace = special:sound silent
}

## Spotify
exec-once = [workspace special:sound silent] spotify
windowrule {
  name = Spotify
  match:class = spotify
  workspace = special:sound silent
}

## Steam
exec-once = [workspace special:steam silent] steam
windowrule {
  name = Steam
  match:class = steam
  workspace = special:steam silent
}

## Discord
exec-once = [workspace special:discord silent] killall -q equibop;sleep .5 && equibop
# exec-once = flatpak run dev.vencord.Vesktop --ozone-platform=wayland
# exec-once = vesktop --ozone-platform=wayland
# exec-once = discord --ozone-platform=wayland
windowrule {
  name = Discord
  match:class = (vesktop|discord|equibop)
  workspace = special:discord silent
}

## System
exec-once = lxqt-policykit-agent
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = kdeconnect-indicator
exec-once = nm-applet --indicator


################
## Enviroment ##
################
env = NIXOS_OZONE_WL, 1
env = NIXPKGS_ALLOW_UNFREE, 1
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = GDK_BACKEND, wayland, x11
env = CLUTTER_BACKEND, wayland
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
# env = SDL_VIDEODRIVER, wayland;x11;windows
env = SDL_VIDEODRIVER, wayland,x11,windows
env = MOZ_ENABLE_WAYLAND, 1
env = BRAVE_ENABLE_WAYLAND_IME, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = GBM_BACKEND, nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = LIBVA_DRIVER_NAME, nvidia



##########
## Main ##
##########

general {
  gaps_in = 6
  gaps_out = 8
  border_size = 2
  layout = dwindle
  resize_on_border = true
  col.active_border = rgba(f4dbd6ee) rgba(8aadf4ee) 90deg
  col.inactive_border = rgba(595959aa)
}
misc {
  initial_workspace_tracking = 0
  mouse_move_enables_dpms = true
  key_press_enables_dpms = false
  # enable_anr_dialog = false
}
animations {
  enabled = yes
  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1
  animation = windows, 1, 6, wind, slide
  animation = windowsIn, 1, 6, winIn, slide
  animation = windowsOut, 1, 5, winOut, slide
  animation = windowsMove, 1, 5, wind, slide
  animation = border, 1, 1, liner
  animation = fade, 1, 10, default
  animation = workspaces, 1, 5, wind
  animation = specialWorkspace, 1, 3, liner, fade
}
decoration {
  rounding = 10
  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }
  blur {
    enabled = true
    size = 5
    passes = 3
    new_optimizations = on
    ignore_opacity = off
  }
}
dwindle {
  pseudotile = true
  preserve_split = true
}
opengl {
nvidia_anti_flicker = true
}
cursor {
no_hardware_cursors = true
}
plugin {
    hyprsplit {
        num_workspaces = 6
    }
}


##################
## KEYBINDINGSS ## Use wev to find keys
##################
$mod = SUPER

## App Shortcuts
bind = $mod, E, exec, $fileManager
bind = $mod, Q, exec, $terminal
bind = $mod, B, exec, $browser
bind = $mod, Y, exec, $youtube
bind = $mod, C, exec, $editor
bind = $mod ALT, W, exec, wallsetter
bind = $mod, O, exec, $noteeditor
bind = , XF86AudioMedia, exec, cd ~/Desktop/Design/Code/Projects/Python/GUI-Audioman/ && nix-shell


## bind = $mod, M, exit,
bind = $mod, F, togglefloating,
bind = $mod alt, space, exec, $menu
bind = $mod, J, togglesplit,

bind = $mod, W, killactive,
# Safety Mode
bind = $mod CTRL SHIFT ALT, W, exec, hyprctl keyword unbind SUPER,W
bind = $mod CTRL SHIFT ALT, escape, exec, hyprctl keyword bind SUPER,W,killactive

bind = $mod CTRL SHIFT, W, exec, hyprctl kill

## screenshot
bind = , print, exec, $screenshot

## Clipbard History
bind = $mod, V, exec, $clipboardhistory

## Hardware Managers
bind = control shift, escape, exec, $hardwaremanager
bind = $mod shift, escape, exec, $gpumanager

## fullscreen
bind = $mod shift, F, fullscreen, 0

## Pin a floating window
bind = $mod, T, pin

## Brightness
bindl =, XF86MonBrightnessUp, exec, brightnessctl -c backlight set +10%
bindl =, XF86MonBrightnessDown, exec, brightnessctl -c backlight set 10%-

## Media Keys
## Volume
# bindel =, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# bindel =, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
## App specific volume key using script replaceing old
# Volume up - adjust based on focused application
bind = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh up
# Volume down - adjust based on focused application  
bind = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh down
# Optional: Mute toggle
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
#######################################################################################
bindel =, XF86AudioRaiseVolume, exec, 
bindel =, XF86AudioLowerVolume, exec, 
## Media Controls
bindl =,XF86AudioPlay,exec,playerctl play-pause
bindl =,XF86AudioNext,exec,playerctl next
bindl =,XF86AudioPrev,exec,playerctl previous
  ## Keyboard media arrow keys
bindl = $mod ALT, 114,exec,playerctl next
bindl = $mod ALT, 113,exec,playerctl previous
  ## Volume arrow keys
bindel = $mod ALT, 111, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mod ALT, 116, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
  ## Spotify music keys
# bindelp = CTRL, 79, exec, wpctl set-volume -p $(wpctl status | grep "spotify" | grep -oP 'pid:\K\d+') 5%+
# bindelp = CTRL, 83, exec, wpctl set-volume -p $(wpctl status | grep "spotify" | grep -oP 'pid:\K\d+') 5%-
  ## Mouse Mute Key
bindl = control, 106, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle


##############
## Keybinds ##
##############

## Move focus with mod + arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

## Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

## Split monitor plugin
## Switch workspaces with mod + [0-5]
bind = $mod, 1, split:workspace, 1
bind = $mod, 2, split:workspace, 2
bind = $mod, 3, split:workspace, 3
bind = $mod, 4, split:workspace, 4
bind = $mod, 5, split:workspace, 5

## Switch workspaces with mod + mouse side scrol
bindp = $mod, mouse:276, split:workspace, +1
bindp = $mod, mouse:275, split:workspace, -1

## Move active window to a workspace with mod + SHIFT + [0-5]
bind = $mod SHIFT, 1, split:movetoworkspace, 1
bind = $mod SHIFT, 2, split:movetoworkspace, 2
bind = $mod SHIFT, 3, split:movetoworkspace, 3
bind = $mod SHIFT, 4, split:movetoworkspace, 4
bind = $mod SHIFT, 5, split:movetoworkspace, 5

## Move active window to a workspace
bind = $mod SHIFT, mouse:276, split:movetoworkspace, +1
bind = $mod SHIFT, mouse:275, split:movetoworkspace, -1

## Move active workspace to other monitor
bind = $mod, mouse_right, split:swapactiveworkspaces, current +1
bind = $mod, mouse_left, split:swapactiveworkspaces, current -1

## For Monitor Disconnections
bind = $mod SHIFT, C, split:grabroguewindows

## spcial Workspace Discord
bind = $mod, D, togglespecialworkspace, discord
bind = $mod SHIFT, D, split:movetoworkspace, special:discord

## special workspace Sound for spotify, qpw, ect
bind = $mod, S, togglespecialworkspace, sound
bind = $mod SHIFT, S, split:movetoworkspace, special:sound

## special workspace for Steam
bind = $mod, G, togglespecialworkspace, steam
bind = $mod SHIFT, G, split:movetoworkspace, special:steam

bind = $mod, A, togglespecialworkspace, A
bind = $mod SHIFT, A, split:movetoworkspace, special:A




############################
## WINDOWS AND WORKSPACES ##  USE (hyprctl clients) To list all windows and classes
############################

## stops maximixes
windowrule {
  name = Core
  match:class = (.*)

  suppress_event = maximize
}

## Set borader color if floater is pinned
windowrule {
  name = Floating
  match:pin = true

  border_color = rgb(ff4d4d) rgb(ff8000)
}

## Librewolf Floating Video
windowrule {
  name = Librewolf
  match:title = Picture-in-Picture

  float = true
  ## Keep it 16x9
  size = 30% 30%
  keep_aspect_ratio = true
}

## Discord popout no transparencty and have it float
windowrule {
  name = Discord2
  match:title = Discord Popout

  opaque = true
  float = true
}

## rofi and wofi $menu fixes for floating andd focus
windowrule {
  name = Rofi
  match:class = (Rofi|wofi)

  stay_focused = true
  center = true
  border_size = 0
  float = true
}

## Cava no boarders so it's clean
windowrule {
  name = Cava
  match:title = cava

  border_size = 0
  no_shadow = true
}

## Polkit keep focus
windowrule {
  name = Polkit
  match:class = xdg-desktop-portal-gtk

  float = true
}

## Mpv video player
windowrule {
  name = Mpv
  match:class = mpv

  float = true
  keep_aspect_ratio = true 
}

## Bespoke Synth
windowrule {
  name = Bespoke2
  match:class = BespokeSynth
  match:title = bespoke synth
  
  tile = true
}

## Steam Float All But Main Window
windowrule {
  name = Steam
  match:class = steam

  float = true
}
windowrule {
  name = Steam2
  match:class = steam
  match:title = Steam

  tile = true  
}

## Thunar
windowrule {
  name = Thunar
  match:class = ([Tt]hunar)
  match:title = (File Operation Progress|Confirm to replace files)

  float = true
}
windowrule {
  name = Thunar2
  match:title = Select Files

  float = true
  size = 1080 900
}
windowrule {
  name = Thunar3
  match:class = thunar

  opacity = 0.9 0.7
}


## Thunderbird
windowrule {
  name = Thunderbird
  match:class = thunderbird

  float = true
}
windowrule {
  name = Thunderbird2
  match:class = thunderbird
  match:title = Mozilla Thunderbird

  tile = true
}

## Gnome-Calc
windowrule {
  name = Gnome-Calc
  match:class = org.gnome.Calculator
  match:title = Calculator

  float = true
  size = 700 616
}

## Soundcloud Webapp
windowrule {
  name = Soundcloud
  match:title = https://soundcloud.com - qutebrowser

  workspace = special:sound silent
}


## Etc
windowrule {
  name = qt5ct
  match:class = (nwg-look|qt5ct|qt6ct)

  float = true
}
windowrule {
  name = qt6ct
  match:class = qt6ct

  size = 60% 70%
}
windowrule {
  name = portal
  match:class = xdg-desktop-portal-gtk

  size = 70% 70%
}
windowrule {
  name = nm-applet
  match:class = (nm-applet|nm-connection-editor|blueman-manager)

  float = true
}

windowrule {
  name = Bitwarden
  match:class = Bitwarden
  no_screen_share = true
}


